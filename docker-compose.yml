services:
  localstack:
    image: localstack/localstack:latest
    container_name: localstack
    ports:
      - "4566:4566"
    environment:
      LOCALSTACK_AUTH_TOKEN: token
      SERVICES: s3
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      DEBUG: "1"
      PERSISTENCE: "1"
    volumes:
      - localstack_data:/var/lib/localstack
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:4566/_localstack/health || exit 1"
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    restart: unless-stopped

  spark:
    image: apache/spark:4.2.0-python3
    container_name: credit-risk-spark
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      SPARK_ENV: cluster
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      HOME: /tmp
    volumes:
      - ./Scripts:/opt/project/Scripts
      - ./PowerBI:/opt/project/PowerBI
    working_dir: /opt/project
    command: ["sleep", "infinity"]
    restart: unless-stopped

volumes:
  localstack_data: